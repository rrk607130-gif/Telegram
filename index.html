<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Channel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #17212b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        p {
            color: #8ab4f8;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #24a1de;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 0;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>हमारे Telegram चैनल में जुड़ें</h2>
        <p>ताज़ा अपडेट के लिए नीचे बटन पर क्लिक करें:</p>
        <a id="telegram-link" href="https://t.me/+YjFND5cn9k8zMDk1" target="_blank" rel="noopener noreferrer" class="btn">JOIN TELEGRAM</a>
    </div>
</body>
</html>
